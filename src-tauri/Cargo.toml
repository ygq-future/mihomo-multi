[package]
name = "mihomo-multi"
version = "1.7.0"
description = "High-performance multi-port proxy listener client based on Mihomo"
authors = ["sheepyu"]
edition = "2024"
default-run = "mihomo-multi"

[lib]
name = "mihomo_multi_lib"

[[bin]]
name = "mihomo-multi"
path = "src/main.rs"

[[bin]]
name = "mihomo-multi-cli"
path = "src/bin/mihomo-multi-cli.rs"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-shell = "2.2.0"
tauri-plugin-process = "2.2.0"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2.8"
socket2 = "0.5"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.43.0", features = ["full"] }
thiserror = "2.0.11"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls", "stream", "socks"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
log = "0.4.26"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.15.1", features = ["v4", "serde"] }
parking_lot = "0.12.3"
sysinfo = "0.33.1"
urlencoding = "2.1.3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
arboard = { version = "3.7", default-features = false }
clap = { version = "4.5", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_Networking_WinInet",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Com",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.170"
nix = { version = "0.29.0", features = ["signal", "process"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
