[package]
name = "mihomo-multi"
version = "0.1.0"
description = "High-performance multi-port proxy listener client based on Mihomo"
authors = ["sheepyu"]
edition = "2024"

[lib]
name = "mihomo_multi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-shell = "2.2.0"
tauri-plugin-process = "2.2.0"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.43.0", features = ["full"] }
thiserror = "2.0.11"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
log = "0.4.26"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.15.1", features = ["v4", "serde"] }
parking_lot = "0.12.3"
sysinfo = "0.33.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.170"
nix = { version = "0.29.0", features = ["signal", "process"] }
