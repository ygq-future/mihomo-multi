<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mihomo Multi</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('app_theme') || 'system';
          var isDark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        width: 100%;
        user-select: none;
      }
      @media (prefers-color-scheme: dark) {
        html, body {
          background-color: #131722;
          color: #f8fafc;
        }
      }
      @media (prefers-color-scheme: light) {
        html, body {
          background-color: #f6f8fa;
          color: #0f172a;
        }
      }
      html.dark, html.dark body {
        background-color: #131722 !important;
        color: #f8fafc !important;
      }
      html.light, html.light body {
        background-color: #f6f8fa !important;
        color: #0f172a !important;
      }
    </style>
  </head>
  <body class="bg-background text-foreground antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
