name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # Pre-Flight Check 1: Strict Lint, Code Formatting & Static Analysis
  # --------------------------------------------------------------------------
  lint:
    name: Strict Lint & Style Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev squashfs-tools

      - name: Install Node dependencies
        run: pnpm install

      - name: Prepare Sidecar Binary
        run: node scripts/dev-sidecar.mjs

      - name: Check code formatting (Biome)
        run: pnpm format:check

      - name: Lint frontend code (ESLint)
        run: pnpm lint:fe

      - name: Typecheck frontend code (TypeScript)
        run: pnpm typecheck

      - name: Lint backend code (Rust Clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # --------------------------------------------------------------------------
  # Pre-Flight Check 2: Strict Unit & Integration Tests (Linux + Windows)
  # --------------------------------------------------------------------------
  test:
    name: Strict Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev squashfs-tools

      - name: Install Node dependencies
        run: pnpm install

      - name: Prepare Sidecar Binary
        run: node scripts/dev-sidecar.mjs

      - name: Run test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # --------------------------------------------------------------------------
  # Cross-Platform Build & Package Matrix (Only runs after lint and test pass)
  # --------------------------------------------------------------------------
  build:
    name: Build & Package (${{ matrix.name }})
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Windows x64'
            os: windows-latest
            target: 'x86_64-pc-windows-msvc'
            bundle_args: '--bundles nsis,msi'
            rust_targets: 'x86_64-pc-windows-msvc'
          - name: 'Windows ARM64'
            os: windows-latest
            target: 'aarch64-pc-windows-msvc'
            bundle_args: '--bundles nsis'
            rust_targets: 'aarch64-pc-windows-msvc'
          - name: 'macOS Apple Silicon'
            os: macos-latest
            target: 'aarch64-apple-darwin'
            bundle_args: '--bundles dmg'
            rust_targets: 'aarch64-apple-darwin'
          - name: 'macOS Intel'
            os: macos-latest
            target: 'x86_64-apple-darwin'
            bundle_args: '--bundles dmg'
            rust_targets: 'x86_64-apple-darwin'
          - name: 'macOS Universal'
            os: macos-latest
            target: 'universal-apple-darwin'
            bundle_args: '--bundles dmg'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - name: 'Linux x86_64'
            os: ubuntu-22.04
            target: 'x86_64-unknown-linux-gnu'
            bundle_args: '--bundles deb,appimage'
            rust_targets: 'x86_64-unknown-linux-gnu'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev squashfs-tools

      - name: Install Node dependencies
        run: pnpm install

      - name: Prepare Mihomo Sidecar Binary
        run: node scripts/dev-sidecar.mjs --target ${{ matrix.target }}

      - name: Build Tauri Application
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundle_args }}
        env:
          CI: true

      - name: Package and standardize distribution artifacts
        run: node scripts/pack-release-assets.mjs --target ${{ matrix.target }}

      - name: Determine Tag Name and Release Notes
        id: tag_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag || 'v1.0.0' }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [ -f "docs/release-notes/${TAG}.md" ]; then
            echo "body_path=docs/release-notes/${TAG}.md" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: 'Mihomo Multi ${{ steps.tag_info.outputs.tag }}'
          body_path: ${{ steps.tag_info.outputs.body_path }}
          draft: false
          prerelease: false
          files: |
            dist-artifacts/*
